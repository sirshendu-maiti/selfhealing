[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfhealing-ui-automation"
version = "0.1.0"
description = "AI-powered self-healing UI automation framework — Phase 1 scaffold"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6.0", "rapidfuzz>=3.6.0", "playwright>=1.44.0"]

[project.optional-dependencies]
dev = ["pytest>=8.1.0", "ruff>=0.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
